name: Release

# Conventional-commit driven releases. Pushing to main keeps a "chore: release
# x.y.z" PR up to date; merging that PR tags the release and publishes the
# plugin zip that the Playground blueprint installs.
#
# The manual trigger republishes an existing tag. Without it the WordPress.org
# deploy could only ever fire on the one push that created the release, so a
# transient SVN failure or a credential added late could only be recovered by
# cutting a new version.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish to WordPress.org (e.g. v0.2.2)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  # A manual run targets a tag that already exists, so there is no release to
  # cut and nothing for release-please to do.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      pr_branch: ${{ steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName || '' }}
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please updates version.txt and CHANGELOG.md; the plugin carries the
  # version in three more places it can't reach (WordPress header fields reject
  # its inline annotations), so we amend its branch with a scripted sync.
  sync-plugin-version:
    needs: release-please
    if: needs.release-please.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync version markers and readme changelog
        run: |
          version="$(jq -r '.["."]' .release-please-manifest.json)"
          node plugin/hoobert/scripts/bump-version.js "$version"
          node scripts/sync-readme-changelog.js "$version"

      - name: Commit to the release PR
        run: |
          if git diff --quiet; then
            echo "Plugin version markers already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync plugin version markers"
          git push

  # Runs on the push created by merging the release PR, or on a manual run
  # against a tag that already exists. `!cancelled()` is what lets it start at
  # all when release-please was skipped; a failed release-please still leaves
  # `release_created` empty, so a push can't slip through.
  publish:
    needs: release-please
    if: >-
      !cancelled()
      && ( needs.release-please.outputs.release_created == 'true'
      || github.event_name == 'workflow_dispatch' )
    runs-on: ubuntu-latest
    # Step-level `if` can't read `secrets`, so decide here whether the
    # WordPress.org leg of the release is wired up yet.
    env:
      HAS_WPORG_CREDENTIALS: ${{ secrets.SVN_USERNAME != '' && secrets.SVN_PASSWORD != '' }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      # A manual run exists to publish, so a silently skipped deploy is the
      # exact failure this trigger was added to fix. Fail before the build.
      - name: Require WordPress.org credentials on a manual run
        if: github.event_name == 'workflow_dispatch' && env.HAS_WPORG_CREDENTIALS != 'true'
        run: |
          echo "SVN_USERNAME and SVN_PASSWORD must be set as repository secrets." >&2
          exit 1

      # Build the tag's own code, not the branch tip. On a push these are the
      # same commit, since release-please tags the commit being built.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/hoobert/package-lock.json

      - name: Install dependencies
        working-directory: plugin/hoobert
        run: npm ci

      - name: Build front-end bundle
        working-directory: plugin/hoobert
        run: npm run build

      # Stage only the files that ship in the plugin. The zip has a single
      # top-level `hoobert/` folder so it installs under that slug.
      - name: Assemble plugin directory
        run: |
          mkdir -p dist/hoobert
          cp -R \
            plugin/hoobert/hoobert.php \
            plugin/hoobert/tools.json \
            plugin/hoobert/readme.txt \
            plugin/hoobert/includes \
            plugin/hoobert/assets \
            plugin/hoobert/build \
            LICENSE \
            dist/hoobert/
          # wp.org rejects hidden files outright; strip any that rode along.
          # The group matters: without it `-delete` binds only to the last -name.
          find dist \( -name '.DS_Store' -o -name '._*' \) -delete

      - name: Create zip
        working-directory: dist
        run: zip -r ../hoobert.zip hoobert

      # The blueprint installs from `releases/latest/download/hoobert.zip`, so
      # the asset must land on the release for this tag. `--clobber` is what
      # makes a manual re-publish idempotent.
      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" hoobert.zip --clobber

      # The deploy action falls back to deriving the version from GITHUB_REF,
      # which on a manual run is `refs/heads/main` rather than a tag. Pass it
      # explicitly. The `v` has to come off: wp.org tag directories carry no
      # prefix, and readme.txt's Stable tag has to match the directory name.
      - name: Resolve the published version
        run: echo "PLUGIN_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      # Publish to the WordPress.org directory: `trunk`, a version tag, and the
      # directory assets (icons, banner, screenshots, preview blueprint) from
      # .wordpress-org. Skipped when the credentials are absent, which a manual
      # run has already turned into a hard failure above.
      - name: Deploy to WordPress.org
        if: env.HAS_WPORG_CREDENTIALS == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: hoobert
          VERSION: ${{ env.PLUGIN_VERSION }}
          BUILD_DIR: dist/hoobert
          ASSETS_DIR: .wordpress-org
